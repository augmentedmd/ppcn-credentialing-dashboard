<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — PeakPoint Central Nassau Credentialing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-body">
  <div class="auth-shell">
    <header class="auth-brand">
      <img src="/assets/logo.png" alt="PeakPoint Central Nassau Surgery Center" class="auth-logo">
      <h1>Credentialing Dashboard</h1>
      <p>Secure access for credentialing staff, the governing board, and watchers.</p>
    </header>
    <form class="auth-card" id="login-form" autocomplete="on">
      <label class="fld">
        <span>Username</span>
        <input type="text" name="username" id="username" required autocomplete="username" autofocus>
      </label>
      <label class="fld">
        <span>Password</span>
        <input type="password" name="password" id="password" required autocomplete="current-password">
      </label>
      <p class="form-error" id="login-error" hidden></p>
      <button type="submit" class="btn primary" id="login-btn">Sign in</button>
      <p class="auth-demo-hint">
        Demo:&nbsp;<code>board</code>&nbsp;/&nbsp;<code>board</code>
        (vote as Michael Gorin)&nbsp;·&nbsp;
        <code>watcher</code>&nbsp;/&nbsp;<code>watcher</code>
        (read-only)
      </p>
    </form>
    <p class="auth-foot">PeakPoint Central Nassau Surgery Center · AugmentedMD</p>
  </div>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
